[project]
site_name = "Kelvin Project"
site_description = "Repository of information for Kelvin Project"
site_author = "Kenneth Gibb Wraight"

# Replace <username> (and the repo name if different)
site_url = "https://<username>.github.io/kelvin-project/"
repo_name = "GitHub"
repo_url = "https://github.com/<username>/kelvin-project"

nav = [
  { "Home" = "index.md" },
]

extra_javascript = [
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
  "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js",
  "javascripts/mathjax.js",
  "javascripts/tablesort.js",
]

[project.theme]
logo = "img/earth-clock.jpg"
features = ["content.footnote.tooltips"]

[project.theme.icon]
annotation = "material/plus-circle"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true